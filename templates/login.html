


{% extends "layout.html" %}

{% block title %} Login Page  {% endblock title %}


{% block content %}


  <h1 class="login-title">Giriş Sayfası </h1>

      
      <form class="postform" method="POST">
        {{ form.hidden_tag() }}
        
        <p class="username">
            {{ form.username.label }}<br>
            {{ form.username(size=32) }}
        </p>
        
        <p class="password"> 
            {{ form.password.label }}<br>
            {{ form.password(size=32) }}
        </p>
        
         <button class="btn" type="submit">Giriş Yap</button>
    </form>
       <a class="login-form" href="{{url_for('main.register')}}">Kaydolmak için Tıkla</a> 


       








{% endblock content %}
